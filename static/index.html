<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>个人数据权利请求</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#263842}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d4dde2;padding:7px}th{background:#eef5f5}.card{background:#eef8f7;border-left:5px solid #2d827b;padding:12px 16px}code{background:#edf1f2;padding:2px 5px}.overdue{color:#a11b1b;font-weight:600}.s-effective{color:#1c6b4f;font-weight:600}.s-draft{color:#9a6b00;font-weight:600}.s-superseded{color:#6b7780}.s-withdrawn{color:#a11b1b}.muted{color:#6b7780;font-size:13px}</style>
<h1>个人数据权利请求处理</h1><div class="card">案件绑定<strong>受理时已生效的规则版本</strong>，延期、重算均按该版本判断；规则补正先生成草案，到生效时间才用于新案件。页面不展示联系方式明文。</div>
<h2>处理队列</h2><table id="requests"><thead><tr><th>请求号</th><th>类型</th><th>地区</th><th>状态</th><th>规则版本</th><th>原到期日</th><th>当前到期日</th><th>处理人</th></tr></thead><tbody></tbody></table>
<h2>数据定位</h2><table id="locations"><thead><tr><th>请求</th><th>系统</th><th>类别</th><th>状态</th><th>法律保留</th></tr></thead><tbody></tbody></table>
<h2>地区规则版本</h2><table id="rules"><thead><tr><th>地区</th><th>版本</th><th>状态</th><th>响应天数</th><th>延期上限</th><th>生效时间</th><th>变更原因</th><th>撤回</th></tr></thead><tbody></tbody></table>
<div class="muted" id="rules-hint"></div>
<script>
const STATUS_TEXT={draft:'草案（未生效）',effective:'生效中',superseded:'已被取代',withdrawn:'已撤回'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  const d=await fetch('/api/state').then(r=>r.json());
  document.querySelector('#requests tbody').innerHTML=d.requests.map(r=>`<tr class="${r.overdue?'overdue':''}">
    <td>${esc(r.request_no)}</td><td>${esc(r.request_type)}</td><td>${esc(r.jurisdiction)}</td>
    <td>${esc(r.status)}</td><td>${esc(r.rule_version_label||'未绑定')}</td>
    <td>${esc(r.original_due_date)}</td><td>${esc(r.due_date)}</td><td>${esc(r.assigned_to||'')}</td></tr>`).join('');
  document.querySelector('#locations tbody').innerHTML=d.locations.map(r=>`<tr><td>${esc(r.request_id)}</td><td>${esc(r.system_name)}</td><td>${esc(r.data_category)}</td><td>${esc(r.status)}</td><td>${r.legal_hold?'是':'否'}</td></tr>`).join('');
  const rules=d.rule_versions||[];
  document.querySelector('#rules tbody').innerHTML=rules.map(v=>`<tr>
    <td>${esc(v.jurisdiction_name||v.code)} <span class="muted">${esc(v.code)}</span></td>
    <td>v${v.version_no}</td><td class="s-${esc(v.status)}">${STATUS_TEXT[v.status]||v.status}</td>
    <td>${v.response_days}</td><td>${v.max_extension_days}</td>
    <td>${esc(v.effective_at||'—')}</td><td>${esc(v.change_reason||'')}
      ${v.withdraw_reason?`<div class="muted">撤回：${esc(v.withdraw_reason)}</div>`:''}</td>
    <td>${v.withdrawn_by?esc(v.withdrawn_by)+' @ '+esc(v.withdrawn_at):'—'}</td></tr>`).join('');
  document.querySelector('#rules-hint').textContent=rules.length
    ? '每次规则补正都生成新版本；生效后的旧版本标记为“已被取代”，但仍可查、仍约束其生效期间受理的案件。'
    : '尚无地区规则。';
}
load();
</script></html>
